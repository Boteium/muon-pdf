name: Binary Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux ${{ matrix.label }} AppImage (Ubuntu 26.04)
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: x86_64
            linuxdeploy_arch: x86_64
            appimage_name: muon-pdf-linux-x86_64.AppImage
          - runner: ubuntu-24.04-arm
            label: aarch64
            linuxdeploy_arch: aarch64
            appimage_name: muon-pdf-linux-aarch64.AppImage

    steps:
      - name: Install build dependencies from Ubuntu repo
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            file \
            git \
            patchelf \
            pkg-config \
            wget \
            zig0.15 \
            libgtk-4-dev \
            libmupdf-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release binary
        run: make ZIG=zig0.15 ARCH=native CPU=baseline OPT=ReleaseSmall STATIC=false

      - name: Package AppImage
        run: |
          bash packaging/appimage/build-appimage.sh "${{ matrix.linuxdeploy_arch }}" "${{ matrix.appimage_name }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muon-pdf-linux-${{ matrix.label }}
          path: |
            ${{ matrix.appimage_name }}
            ${{ matrix.appimage_name }}.sha256

      - name: Upload assets to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          overwrite_files: true
          files: |
            ${{ matrix.appimage_name }}
            ${{ matrix.appimage_name }}.sha256
