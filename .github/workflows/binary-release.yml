name: Binary Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux ${{ matrix.label }} binary (Ubuntu 26.04)
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: x86_64
            archive_name: muon-pdf-linux-x86_64.tar.gz
          - runner: ubuntu-24.04-arm
            label: aarch64
            archive_name: muon-pdf-linux-aarch64.tar.gz

    steps:
      - name: Install build dependencies from Ubuntu repo
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            git \
            pkg-config \
            zig0.15 \
            libgtk-4-dev \
            libmupdf-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release binary
        run: make ZIG=zig0.15 ARCH=native OPT=ReleaseSmall STATIC=false

      - name: Package release tarball
        run: |
          mkdir -p dist
          cp zig-out/bin/muon-pdf dist/
          cp muon-pdf.desktop dist/
          cp packaging/release/install.sh dist/
          cp packaging/release/uninstall.sh dist/
          cp README.md dist/
          cp LICENSE dist/
          chmod +x dist/install.sh dist/uninstall.sh
          tar -czf "${{ matrix.archive_name }}" -C dist .
          sha256sum "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muon-pdf-linux-${{ matrix.label }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

      - name: Upload assets to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          overwrite_files: true
          files: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256
